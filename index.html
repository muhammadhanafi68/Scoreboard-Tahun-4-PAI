<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Pendahulu - Pendidikan Islam Tahun 4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(22, 27, 38, 0.75);
      --card-border: rgba(212, 175, 55, 0.2);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --silver-gradient: linear-gradient(135deg, #e0e0e0, #f5f5f5, #9e9e9e, #e0e0e0);
      --bronze-gradient: linear-gradient(135deg, #c47c48, #f1be9b, #935123, #c47c48);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 100%, rgba(13, 148, 136, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--gold-primary);
      text-transform: uppercase;
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 50px;
      background: rgba(212, 175, 55, 0.05);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 35px;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 10px #10b981;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
      align-items: flex-end;
    }

    .podium-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease;
    }

    .podium-card.rank-1 {
      border-color: rgba(212, 175, 55, 0.6);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.1) 0%, rgba(22, 27, 38, 0.8) 100%);
    }

    .podium-crown {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      font-size: 1.2rem;
      color: #0a0d14;
    }

    .rank-1 .avatar { background: var(--gold-gradient); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
    .rank-2 .avatar { background: var(--silver-gradient); box-shadow: 0 0 15px rgba(224, 224, 224, 0.3); }
    .rank-3 .avatar { background: var(--bronze-gradient); box-shadow: 0 0 15px rgba(196, 124, 72, 0.3); }

    .podium-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .podium-class {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .podium-score {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    .top-sub-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 35px;
    }

    .top-sub-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }

    .top-sub-rank {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--gold-primary);
      margin-right: 15px;
      font-size: 1rem;
    }

    .top-sub-info {
      flex-grow: 1;
    }

    .top-sub-name {
      font-weight: 600;
      font-size: 0.88rem;
    }

    .top-sub-class {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .top-sub-score {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      padding: 14px 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.88rem;
    }

    .table-rank {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      color: var(--text-muted);
      width: 60px;
    }

    .table-score {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--gold-primary);
    }

    @media (max-width: 640px) {
      .podium-grid { grid-template-columns: 1fr; }
      .top-sub-grid { grid-template-columns: 1fr; }
      .podium-card.rank-1 { order: -1; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <div class="header-badge">Papan Pendahulu Kebangsaan</div>
    <h1>Pendidikan Islam Tahun 4</h1>
    <p class="subtitle">Al-Quran, Hadis dan Akidah</p>
  </div>

  <div class="status-bar">
    <div><span class="live-dot"></span> Kemas Kini Masa Nyata (Live)</div>
    <div id="last-updated">Memuatkan data...</div>
  </div>

  <div class="podium-grid" id="podium-container"></div>
  <div class="top-sub-grid" id="top-sub-container"></div>

  <div class="section-title">Kedudukan Keseluruhan Murid</div>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 70px;">#</th>
          <th>Nama Murid</th>
          <th>Kelas</th>
          <th style="text-align: right;">Markah</th>
        </tr>
      </thead>
      <tbody id="scoreboard-body">
        <tr>
          <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">Memuatkan data markah...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzoD84rVBhWjk5MVEn1nANKax8FdqMuVRr2i_s80Yh8A2ikn-JA4bYC7Uu-6iN0TvW32Q/exec";

  async function fetchScoreboard() {
    try {
      // Menggunakan mode redirect untuk mengatasi masalah Google Apps Script API
      const response = await fetch(API_URL, { redirect: 'follow' });
      if (!response.ok) throw new Error('Ralat rangkaian');
      
      const data = await response.json();

      const podiumContainer = document.getElementById('podium-container');
      const topSubContainer = document.getElementById('top-sub-container');
      const tbody = document.getElementById('scoreboard-body');

      podiumContainer.innerHTML = '';
      topSubContainer.innerHTML = '';
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">Tiada data latihan ditemui.</td></tr>';
        return;
      }

      // Render Top 3 Podium
      const top3Data = [
        { student: data[1], rank: 2, class: 'rank-2', crown: '' },
        { student: data[0], rank: 1, class: 'rank-1', crown: '👑' },
        { student: data[2], rank: 3, class: 'rank-3', crown: '' }
      ];

      top3Data.forEach(item => {
        if (item.student) {
          podiumContainer.innerHTML += `
            <div class="podium-card ${item.class}">
              ${item.crown ? `<div class="podium-crown">${item.crown}</div>` : ''}
              <div class="avatar">${item.rank}</div>
              <div class="podium-name" title="${item.student.name}">${item.student.name}</div>
              <div class="podium-class">${item.student.kelas}</div>
              <div class="podium-score">${item.student.rawScore}</div>
            </div>
          `;
        }
      });

      // Render Top 4 & Top 5
      const top4and5 = data.slice(3, 5);
      top4and5.forEach((student, idx) => {
        const rank = idx + 4;
        topSubContainer.innerHTML += `
          <div class="top-sub-card">
            <div class="top-sub-rank">#${rank}</div>
            <div class="top-sub-info">
              <div class="top-sub-name">${student.name}</div>
              <div class="top-sub-class">${student.kelas}</div>
            </div>
            <div class="top-sub-score">${student.rawScore}</div>
          </div>
        `;
      });

      // Render Senarai Bermula Kedudukan Ke-6
      const restOfStudents = data.slice(5);
      if (restOfStudents.length === 0 && data.length <= 5) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 15px;">Semua peserta teratas dipaparkan di atas.</td></tr>';
      } else {
        restOfStudents.forEach((student, index) => {
          const rank = index + 6;
          tbody.innerHTML += `
            <tr>
              <td class="table-rank">#${rank}</td>
              <td><strong>${student.name}</strong></td>
              <td style="color: var(--text-muted);">${student.kelas}</td>
              <td style="text-align: right;" class="table-score">${student.rawScore}</td>
            </tr>
          `;
        });
      }

      const now = new Date();
      document.getElementById('last-updated').innerText = `Kemaskini: ${now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

    } catch (error) {
      console.error('Ralat semasa mengambil data:', error);
      document.getElementById('last-updated').innerText = 'Gagal memuatkan data!';
      document.getElementById('scoreboard-body').innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444; padding: 20px;">Sila pastikan tetapan Apps Script dibuat kepada 'Anyone'.</td></tr>`;
    }
  }

  fetchScoreboard();
  setInterval(fetchScoreboard, 10000);
</script>

</body>
</html>
